[Socket]
# OpenPlotter's signalk post-install rewrites signalk.socket to ListenStream=3000
# only, killing HTTPS on 3443. Drop-ins are never touched by OpenPlotter, and the
# empty ListenStream= resets whatever the main unit file declares, so the port
# list below always wins: 3443 first (HTTPS), 3000 second (HTTP redirect).
ListenStream=
ListenStream=3443
ListenStream=3000
