[Service]
# Restore ssl/port/sslport in settings.json if a tool (OpenPlotter, admin UI) dropped them
ExecStartPre=/usr/local/bin/signalk-ensure-ssl.sh
# OpenPlotter's post-install rewrites signalk.service with EXTERNALPORT=3000;
# a later duplicate assignment wins, so this drop-in always restores 3443.
Environment=EXTERNALPORT=3443
