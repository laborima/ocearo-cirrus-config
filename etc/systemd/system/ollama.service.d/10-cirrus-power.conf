# Cirrus power tuning for a Raspberry Pi 5 that also drives two Chromium kiosks.
#
# The CPU caps were already in place; KEEP_ALIVE is the addition that matters:
# the default holds the model resident for 5 minutes after every generation,
# which is ~1.4 GB of RAM on llama3.2:1b for a boat that asks a question every
# few minutes at most.
[Service]
CPUQuota=250%
CPUWeight=20
Nice=15
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_KEEP_ALIVE=60s
Environment=OLLAMA_MAX_LOADED_MODELS=1
